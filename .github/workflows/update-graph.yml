# Daily: write profile/activity-graph.svg, the org profile's contribution graph.
# GitHub has no graph for an organization, so the script sums the members' calendars, counting only
# contributions to the-code-foundry repos. Members are listed by name: the org's member list is private.
name: update-graph
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/activity_graph.py profile/activity-graph.svg --org the-code-foundry atlaschelon vladbabii
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-graph.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update activity graph"
          git push
